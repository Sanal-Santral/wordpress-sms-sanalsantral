# Two demo shops on the two supported WordPress majors, sharing one database
# server. The plugins are bind-mounted, so code changes show up on reload.
#
#   WordPress 7.1 → http://localhost:8071/wp-admin
#   WordPress 7.0 → http://localhost:8070/wp-admin

name: ss-sms-demo

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp

x-cli: &cli
  image: wordpress:cli-php8.3
  # The cli image's www-data is uid 82 (Alpine), the apache image's is 33.
  user: "33:33"
  entrypoint: ["sh", "/setup.sh"]
  restart: "no"

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wp71:
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8071:80"
    environment: &wp71-env
      <<: *db-env
      WORDPRESS_DB_NAME: wp71
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8071' );
        define( 'WP_SITEURL', 'http://localhost:8071' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp71:/var/www/html
      - ../sanalsantral-sms:/var/www/html/wp-content/plugins/sanalsantral-sms:ro
      - ../sanalsantral-sms-otp:/var/www/html/wp-content/plugins/sanalsantral-sms-otp:ro

  wp70:
    # The official image is only rebuilt for the latest WordPress release, so
    # the 7.0 tag is stuck on an unpatched PHP. Run the patched 7.1 image and
    # pin the core to 7.0 in setup.sh instead.
    image: wordpress:7.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8070:80"
    environment: &wp70-env
      <<: *db-env
      WORDPRESS_DB_NAME: wp70
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8070' );
        define( 'WP_SITEURL', 'http://localhost:8070' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp70:/var/www/html
      - ../sanalsantral-sms:/var/www/html/wp-content/plugins/sanalsantral-sms:ro
      - ../sanalsantral-sms-otp:/var/www/html/wp-content/plugins/sanalsantral-sms-otp:ro

  # One-shot installers: WordPress, Turkish language, WooCommerce, the two
  # plugins, demo customer/product/order, gateway credentials from .env.
  # Safe to re-run: `docker compose run --rm cli71`.
  cli71:
    <<: *cli
    depends_on: [wp71]
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *wp71-env
      SITE_URL: http://localhost:8071
      SITE_TITLE: SMS Demo (WordPress 7.1)
      HOME: /tmp
    volumes:
      - wp71:/var/www/html
      - ../sanalsantral-sms:/var/www/html/wp-content/plugins/sanalsantral-sms:ro
      - ../sanalsantral-sms-otp:/var/www/html/wp-content/plugins/sanalsantral-sms-otp:ro
      - ./setup.sh:/setup.sh:ro

  cli70:
    <<: *cli
    depends_on: [wp70]
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *wp70-env
      SITE_URL: http://localhost:8070
      SITE_TITLE: SMS Demo (WordPress 7.0)
      WP_CORE_VERSION: "7.0"
      HOME: /tmp
    volumes:
      - wp70:/var/www/html
      - ../sanalsantral-sms:/var/www/html/wp-content/plugins/sanalsantral-sms:ro
      - ../sanalsantral-sms-otp:/var/www/html/wp-content/plugins/sanalsantral-sms-otp:ro
      - ./setup.sh:/setup.sh:ro

volumes:
  db:
  wp70:
  wp71:
